<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#14123a" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="GameNight" />
    <meta name="description" content="A football game that feels real." />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>GameNight</title>
    <link rel="preload" href="/icons/icon-512.png" as="image" />
    <link rel="preload" href="/fonts/jersey-10.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/silkscreen.woff2" as="font" type="font/woff2" crossorigin />
    <!--
      Boot screen: plain HTML and CSS, painted before any script downloads. Its first frame is
      the phone's own launch splash (the app icon on the night colour, dead centre), so the
      hand-over is invisible; then the screen builds out in the game's pixel art: the icon hops
      up, the wordmark and a segmented loading bar drop in, and the ground switches on around
      it: floodlights, a stand of crowd lights, the pitch. Motion is stepped, like a cartridge.
    -->
    <style>
      @font-face { font-family: 'Boot Pixel'; src: url('/fonts/jersey-10.woff2') format('woff2'); font-display: swap; }
      @font-face { font-family: 'Boot Small'; src: url('/fonts/silkscreen.woff2') format('woff2'); font-display: swap; }
      html, body { background: #14123a; }
      #boot {
        /* One art pixel. Everything on this screen is drawn in whole art pixels. */
        --p: min(1vmin, 9px);
        --cream: #f7f3e8;
        --gold: #ffd447;
        --ink: #170f2c;
        position: fixed; inset: 0; z-index: 1000; overflow: hidden; background: #14123a; color: var(--cream);
        font-family: 'Boot Pixel', 'Arial Narrow', sans-serif;
        transition: opacity 0.4s steps(4), visibility 0s 0.4s;
        -webkit-user-select: none; user-select: none;
      }
      #boot.done { opacity: 0; visibility: hidden; }
      #boot *, #boot *::before, #boot *::after { position: absolute; box-sizing: border-box; }

      /* ---- the ground, switched on around the logo */
      #boot .scene { inset: 0; opacity: 0; animation: boot-on 0.6s 0.35s steps(4) forwards; }
      #boot .stars, #boot .stars2 { left: 0; top: 0; width: var(--p); height: var(--p); background: transparent; }
      #boot .stars {
        box-shadow: 6vw 9vh #fffbe6, 19vw 4vh #a99fc6, 31vw 14vh #fffbe6, 46vw 6vh #a99fc6, 58vw 17vh #fffbe6,
          72vw 5vh #fffbe6, 84vw 13vh #a99fc6, 93vw 7vh #fffbe6, 12vw 24vh #a99fc6, 88vw 26vh #a99fc6;
        animation: boot-twinkle 1.6s steps(1) infinite;
      }
      #boot .stars2 {
        box-shadow: 3vw 18vh #a99fc6, 25vw 9vh #fffbe6, 39vw 3vh #fffbe6, 52vw 12vh #a99fc6, 65vw 9vh #a99fc6,
          78vw 20vh #fffbe6, 97vw 15vh #fffbe6, 35vw 25vh #a99fc6, 62vw 26vh #fffbe6;
        animation: boot-twinkle 1.6s 0.8s steps(1) infinite;
      }
      @keyframes boot-twinkle { 50% { opacity: 0.25; } }
      /* A night sky warming in hard bands toward the lit ground, as in the icon. */
      #boot .glow {
        left: 0; right: 0; bottom: 20%; height: 34%;
        background: linear-gradient(transparent 0 20%, #1a1240 20% 42%, #26175a 42% 62%, #3b1d68 62% 80%, #5c2470 80% 92%, #8a3170 92%);
      }
      #boot .stand {
        left: 0; right: 0; bottom: 11%; height: 12%; background: var(--ink);
        clip-path: polygon(0 45%, 6% 45%, 6% 30%, 14% 30%, 14% 15%, 86% 15%, 86% 30%, 94% 30%, 94% 45%, 100% 45%, 100% 100%, 0 100%);
      }
      #boot .stand::before, #boot .stand::after {
        content: ''; left: 0; right: 0; top: 35%; bottom: 18%; opacity: 0;
        background: radial-gradient(#a99fc6 calc(var(--p) * 0.55), transparent 0) 0 0 / calc(var(--p) * 4) calc(var(--p) * 3);
        animation: boot-on 0.3s 1.25s steps(2) forwards, boot-crowd 0.9s 1.6s steps(1) infinite;
      }
      #boot .stand::after {
        background: radial-gradient(#fff0bf calc(var(--p) * 0.55), transparent 0) calc(var(--p) * 2) calc(var(--p) * 1.5) / calc(var(--p) * 8) calc(var(--p) * 6);
        animation: boot-on 0.3s 1.45s steps(2) forwards, boot-crowd 0.9s 2.05s steps(1) infinite;
      }
      @keyframes boot-crowd { 50% { opacity: 0.55; } }
      #boot .pitch {
        left: 0; right: 0; bottom: 0; height: 11%;
        background:
          linear-gradient(var(--cream), var(--cream)) 0 0 / 100% var(--p) no-repeat,
          linear-gradient(transparent 70%, rgba(23, 15, 44, 0.35) 70%),
          repeating-linear-gradient(90deg, #2f7a3c 0 calc(var(--p) * 10), #3d9447 0 calc(var(--p) * 20));
      }
      /* Floodlight pylons: a dark lattice mast, a checkerboard lamp bank that flickers on. */
      #boot .pylon { bottom: 11%; height: 58%; width: calc(var(--p) * 14); }
      #boot .pylon.l { left: 6%; }
      #boot .pylon.r { right: 6%; }
      #boot .mast {
        left: calc(var(--p) * 6); width: calc(var(--p) * 2); top: calc(var(--p) * 6); bottom: 0;
        background: repeating-linear-gradient(var(--ink) 0 calc(var(--p) * 2), #24183f 0 calc(var(--p) * 3));
      }
      #boot .lamp {
        left: 0; top: 0; width: calc(var(--p) * 14); height: calc(var(--p) * 7);
        border: var(--p) solid var(--ink);
        background: repeating-conic-gradient(#fffbe6 0 25%, #fff0bf 0 50%) 0 0 / calc(var(--p) * 2) calc(var(--p) * 2);
        filter: brightness(0.3) saturate(0.4);
        animation: boot-lamp 0.45s steps(1) forwards;
      }
      #boot .l .lamp { animation-delay: 0.7s; }
      #boot .r .lamp { animation-delay: 0.95s; }
      #boot .lamp::after {
        /* A square halo in stepped rings: pixel-art light. */
        content: ''; inset: calc(var(--p) * -1); opacity: 0;
        box-shadow: 0 0 0 calc(var(--p) * 2) rgba(255, 240, 191, 0.3), 0 0 0 calc(var(--p) * 5) rgba(255, 240, 191, 0.13),
          0 0 0 calc(var(--p) * 9) rgba(255, 240, 191, 0.06);
        animation: boot-on 0.1s 1s steps(1) forwards;
      }
      #boot .r .lamp::after { animation-delay: 1.25s; }
      @keyframes boot-lamp {
        0% { filter: none; } 25% { filter: brightness(0.3) saturate(0.4); } 50%, 100% { filter: none; }
      }
      #boot .cone {
        top: calc(var(--p) * 7); left: calc(var(--p) * -14); width: calc(var(--p) * 42); height: 260%; opacity: 0;
        clip-path: polygon(38% 0, 62% 0, 100% 100%, 0 100%);
        background: linear-gradient(rgba(255, 240, 191, 0.16) 0 25%, rgba(255, 240, 191, 0.1) 25% 50%, rgba(255, 240, 191, 0.05) 50% 75%, transparent 75%);
        animation: boot-on 0.2s steps(2) forwards;
      }
      #boot .l .cone { animation-delay: 0.95s; transform: skewX(14deg); transform-origin: 50% 0; }
      #boot .r .cone { animation-delay: 1.2s; transform: skewX(-14deg); transform-origin: 50% 0; }
      @keyframes boot-on { to { opacity: 1; } }

      /* ---- the logo block. Heights are exact so the icon can start dead centre. */
      #boot .mid {
        left: 50%; top: 50%; width: calc(var(--p) * 70); height: calc(var(--p) * 63);
        margin: calc(var(--p) * -31.5) 0 0 calc(var(--p) * -35);
        transform: translateY(calc(var(--p) * 15.5));
        animation: boot-hop 0.4s 0.3s steps(4) forwards;
      }
      @keyframes boot-hop { to { transform: none; } }
      #boot .icon {
        left: calc(var(--p) * 19); top: 0; width: calc(var(--p) * 32); height: calc(var(--p) * 32);
        image-rendering: pixelated;
        box-shadow: 0 calc(var(--p) * -1) 0 0 var(--ink), 0 var(--p) 0 0 var(--ink), calc(var(--p) * -1) 0 0 0 var(--ink),
          var(--p) 0 0 0 var(--ink), calc(var(--p) * 2) calc(var(--p) * 2) 0 var(--p) rgba(0, 0, 0, 0.45);
      }
      #boot h1 {
        left: 0; right: 0; top: calc(var(--p) * 35); height: calc(var(--p) * 13); margin: 0;
        font-weight: 400; font-size: calc(var(--p) * 16); line-height: calc(var(--p) * 13); text-align: center;
        letter-spacing: 0.05em; text-transform: uppercase;
        text-shadow: calc(var(--p) * 0.8) calc(var(--p) * 0.8) 0 rgba(0, 0, 0, 0.6);
      }
      #boot h1 b { position: static; color: var(--gold); font-weight: 400; }
      #boot .bar {
        left: calc(var(--p) * 5); right: calc(var(--p) * 5); top: calc(var(--p) * 52); height: calc(var(--p) * 4);
        background: #0c0a24;
        box-shadow: 0 calc(var(--p) * -1) 0 0 rgba(190, 200, 255, 0.35), 0 var(--p) 0 0 rgba(190, 200, 255, 0.35),
          calc(var(--p) * -1) 0 0 0 rgba(190, 200, 255, 0.35), var(--p) 0 0 0 rgba(190, 200, 255, 0.35),
          calc(var(--p) * 2) calc(var(--p) * 2) 0 var(--p) rgba(0, 0, 0, 0.45);
      }
      /* 24 blocks, revealed one whole block at a time. */
      #boot .segs {
        inset: calc(var(--p) * 0.5);
        background: repeating-linear-gradient(90deg, var(--gold) 0 calc(100% / 24 - var(--p) * 0.5), transparent 0 calc(100% / 24));
        clip-path: inset(0 100% 0 0);
      }
      #boot .runner { left: 0; top: calc(var(--p) * -1.5); width: 0; height: calc(var(--p) * 7); }
      #boot .ball {
        left: calc(var(--p) * -3.5); top: 0; width: calc(var(--p) * 7); height: calc(var(--p) * 7); image-rendering: pixelated;
        background: url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 7 7' shape-rendering='crispEdges'><rect x='2' y='0' width='3' height='1' fill='%23170f2c'/><rect x='1' y='1' width='1' height='1' fill='%23170f2c'/><rect x='2' y='1' width='3' height='1' fill='%23f7f3e8'/><rect x='5' y='1' width='1' height='1' fill='%23170f2c'/><rect x='0' y='2' width='1' height='1' fill='%23170f2c'/><rect x='1' y='2' width='2' height='1' fill='%23f7f3e8'/><rect x='3' y='2' width='1' height='1' fill='%23574e6c'/><rect x='4' y='2' width='2' height='1' fill='%23f7f3e8'/><rect x='6' y='2' width='1' height='1' fill='%23170f2c'/><rect x='0' y='3' width='1' height='1' fill='%23170f2c'/><rect x='1' y='3' width='1' height='1' fill='%23f7f3e8'/><rect x='2' y='3' width='3' height='1' fill='%23574e6c'/><rect x='5' y='3' width='1' height='1' fill='%23f7f3e8'/><rect x='6' y='3' width='1' height='1' fill='%23170f2c'/><rect x='0' y='4' width='1' height='1' fill='%23170f2c'/><rect x='1' y='4' width='2' height='1' fill='%23f7f3e8'/><rect x='3' y='4' width='1' height='1' fill='%23574e6c'/><rect x='4' y='4' width='2' height='1' fill='%23f7f3e8'/><rect x='6' y='4' width='1' height='1' fill='%23170f2c'/><rect x='1' y='5' width='1' height='1' fill='%23170f2c'/><rect x='2' y='5' width='3' height='1' fill='%23f7f3e8'/><rect x='5' y='5' width='1' height='1' fill='%23170f2c'/><rect x='2' y='6' width='3' height='1' fill='%23170f2c'/></svg>") 0 0 / 100% 100%;
        animation: boot-bounce 0.36s steps(1) infinite;
      }
      @keyframes boot-bounce { 50% { transform: translateY(calc(var(--p) * -1)); } }
      #boot .tip {
        left: calc(var(--p) * -30); right: calc(var(--p) * -30); top: calc(var(--p) * 59); height: calc(var(--p) * 4);
        font-family: 'Boot Small', monospace; font-size: calc(var(--p) * 2.6); line-height: calc(var(--p) * 4);
        letter-spacing: 0.06em; text-align: center; text-transform: uppercase; color: #a99fc6;
      }
      #boot :is(h1, .bar, .tip) { opacity: 0; animation: boot-on 0.2s steps(2) forwards; }
      #boot h1 { animation-delay: 0.5s; }
      #boot .bar { animation-delay: 0.65s; }
      #boot .tip { animation-delay: 0.8s; }
      /* Scanlines, as on the menus. */
      #boot .crt {
        inset: 0; pointer-events: none;
        background: repeating-linear-gradient(rgba(0, 0, 0, 0.16) 0 1px, transparent 1px 3px);
      }
      @media (prefers-reduced-motion: reduce) {
        #boot *, #boot *::before, #boot *::after { animation-duration: 0.01s !important; animation-delay: 0s !important; }
        #boot .ball, #boot .stars, #boot .stars2 { animation: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="boot" aria-label="Loading">
      <div class="scene">
        <div class="stars"></div><div class="stars2"></div>
        <div class="glow"></div>
        <div class="pylon l"><div class="cone"></div><div class="mast"></div><div class="lamp"></div></div>
        <div class="pylon r"><div class="cone"></div><div class="mast"></div><div class="lamp"></div></div>
        <div class="stand"></div>
        <div class="pitch"></div>
      </div>
      <div class="mid">
        <img class="icon" src="/icons/icon-512.png" alt="" />
        <h1>Game<b>Night</b></h1>
        <div class="bar"><div class="segs"></div><div class="runner"><div class="ball"></div></div></div>
        <div class="tip">Floodlights on</div>
      </div>
      <div class="crt"></div>
    </div>
    <script>
      // Boot progress: creeps on its own while the code downloads, and the app reports real
      // milestones with __boot(p). The bar shows whole blocks. __bootDone() fades the screen out.
      (function () {
        var el = document.getElementById('boot');
        var segs = el.querySelector('.segs');
        var runner = el.querySelector('.runner');
        var bar = el.querySelector('.bar');
        var tip = el.querySelector('.tip');
        var BLOCKS = 24;
        var shown = 0.02;
        var target = 0.35;
        var tips = [
          'Floodlights on',
          'Hold Shoot for power',
          'Slide up on Pass to loft it',
          'Through balls find the runner',
          'Tap Switch to change player',
          'Sprint, then slide down to tackle',
          'Open packs in the Store',
          'Design your kit and crest',
        ];
        var ti = 0;
        var drawn = -1;
        function draw() {
          var q = Math.round(shown * BLOCKS) / BLOCKS;
          if (q === drawn) return;
          drawn = q;
          segs.style.clipPath = 'inset(0 ' + ((1 - q) * 100).toFixed(2) + '% 0 0)';
          runner.style.transform = 'translateX(' + (q * bar.clientWidth).toFixed(1) + 'px)';
        }
        var timer = setInterval(function () {
          // Ease toward the last reported milestone, and keep inching forward meanwhile.
          target = Math.min(0.94, target + 0.004);
          shown += (target - shown) * 0.12;
          draw();
        }, 60);
        var tipTimer = setInterval(function () {
          ti = (ti + 1) % tips.length;
          tip.textContent = tips[ti];
        }, 2200);
        window.__boot = function (p) {
          target = Math.max(target, Math.min(1, p));
        };
        window.__bootDone = function () {
          target = 1;
          shown = 1;
          draw();
          clearInterval(timer);
          clearInterval(tipTimer);
          setTimeout(function () {
            el.classList.add('done');
            setTimeout(function () { el.remove(); }, 500);
          }, 380);
        };
        draw();
        // Never leave the curtain down if the game hits a problem starting up.
        setTimeout(function () { if (document.getElementById('boot')) window.__bootDone(); }, 20000);
      })();
    </script>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
